trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 10.0.x
- script: dotnet restore dotNet-testing-core.sln
  displayName: Restore
- script: dotnet test dotNet-testing-core.sln --configuration Release --no-restore --logger "trx;LogFileName=results.trx" --results-directory "$(Agent.TempDirectory)/test-results"
  displayName: Backend tests
- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/test-results/*.trx'
    failTaskOnFailedTests: false
    testRunTitle: Backend tests