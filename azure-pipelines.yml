trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: 10.0.x
- script: dotnet restore dotNet-testing-core.sln
  displayName: Restore
- script: dotnet build dotNet-testing-core.sln --no-restore --configuration Release
  displayName: Build
- script: pwsh TestingCore.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
  displayName: Install Chromium
- script: dotnet test dotNet-testing-core.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory "$(Agent.TempDirectory)/test-results"
  displayName: Run tests
- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/test-results/*.trx'
    failTaskOnFailedTests: false
    testRunTitle: dotNet-testing-core